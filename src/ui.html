<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { font: 12px system-ui, -apple-system, sans-serif; margin: 0; padding: 12px;
      background: #fff; color: #333; display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 11px; font-weight: 700; color: #757575; text-transform: uppercase;
      margin-top: 4px; display: block; }
    button { width: 100%; border: 0; border-radius: 6px; padding: 11px;
      color: #fff; background: #18a0fb; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .4px; cursor: pointer; }
    button:disabled { color: #b3b3b3; background: #e6e6e6; cursor: not-allowed; }
    button.setup { background: #14ae5c; }
    button.setup.ready { background: #ffc700; color: #000; }
    button.bake { background: #2c2c2c; }
    button.export { background: #6941c6; }
    button.cancel { background: #c23616; }
    .status-tag { display: none; text-align: center; font-size: 10px; font-weight: 700;
      border-radius: 4px; padding: 5px; }
    .status-tag.standard { display: block; background: #d4edda; color: #155724; }
    .status-tag.explorative { display: block; background: #fff3cd; color: #856404; }
    .paste-zone { width: 100%; min-height: 42px; resize: vertical; border: 2px dashed #f24822;
      background: #fff5f2; color: #f24822; border-radius: 6px; font: 600 11px system-ui;
      padding: 10px; text-align: center; }
    .paste-zone:focus { color: #333; font: 11px monospace; text-align: left;
      background: #fff; }
    .small { font-size: 10px; color: #666; line-height: 1.4; }
    #packStatus { min-height: 14px; overflow-wrap: break-word; }
    .button-pair { display: flex; gap: 6px; }
    .button-pair button { flex: 1; min-width: 0; padding: 10px 5px; }
    hr { width: 100%; border: none; border-top: 1px solid #e6e6e6; margin: 3px 0; }
  </style>
</head>
<body>
  <label>Environment Sync</label>
  <button id="setupBtn" class="setup">Evaluate &amp; Scan File</button>
  <div id="statusTag" class="status-tag"></div>
  <hr>
  <label>Work with AI</label>
  <button id="contextBtn" class="bake" disabled>Copy Selection Context</button>
  <hr>
  <label>AI Snapshot / FigmaPack</label>
  <button id="exportBtn" class="export">Export Complete File to SQLite</button>
  <div id="packStatus" role="status" aria-live="polite" class="small">All pages, nodes, local variables and styles.</div>
  <div class="button-pair">
    <button id="downloadDb" disabled>Download DB</button>
    <button id="copyPrompt" disabled>Copy Prompt</button>
  </div>
  <hr>
  <label>Tooling Clipboard Bridge</label>
  <textarea id="smartPasteField" class="paste-zone" rows="1" placeholder="Click here &amp; Paste (Cmd+V)"></textarea>

  <script>
  /*__EMBED_SQLITE__*/
  </script>
  <script>
  /*__EMBED_PACK_DB__*/
  </script>
  <script>
    const SYSTEM_RULES_HEADER = `
==================================================
STRICT CODE GENERATION & EXECUTION RULES:
==================================================
1. SELECTION CONTEXT FEATURE PREFERENCE:
   - The user has a native "Copy Selection Context" button in their Figma plugin interface.
   - If you need to inspect, review, or analyze the layout, styles, or layer tree of an element the user is currently looking at or working on, DO NOT generate a [READ-ONLY] JavaScript code snippet to read figma.currentPage.selection.
   - Instead, ask the user to select the element and click "Copy Selection Context" in the plugin, then paste the context capsule into this chat.
   - Only generate [READ-ONLY] JavaScript queries when you need to search across unselected pages, find components globally by name, or extract variable details that cannot be covered by a direct canvas selection.

2. ACTION TYPE & EXPECTED OUTCOME FLAG:
   Immediately before ANY \`\`\`javascript code block, you MUST state the action type and expected outcome:
   - **Action Type**: [READ-ONLY] or [WRITE/MUTATION]
   - **Expected Outcome**: [e.g., "Copy layer hierarchy to clipboard" | "Component adjusted" | "New component created"]

3. ZERO PLACEHOLDERS / "AS IS" EXECUTION GUARANTEE:
   - All code inside \`\`\`javascript MUST execute immediately "as is" when pasted.
   - NEVER output code with generic placeholders (e.g., "YOUR_NODE_ID_HERE", "<component-name>", "/* insert token here */").
   - If missing target IDs or parameters, write a dynamic query first (e.g., figma.currentPage.findOne(...)), operate on figma.currentPage.selection[0], or ask the user to select the frame and click "Copy Selection Context" BEFORE generating code.

4. READ-ONLY RETURN CONTRACT (CLIPBOARD LOOP):
   - Every [READ-ONLY] \`\`\`javascript block MUST end with a \`return\` statement that produces the requested data.
   - NEVER use console.log(): console output is invisible in Figma and is NEVER copied to the clipboard.
   - Only a returned value is auto-copied by the plugin as \`=== FIGMA TOOL RESPONSE ===\`.
   - Conversely, [WRITE/MUTATION] blocks MUST NOT return a value. The plugin emits an authoritative \`=== FIGMA CHANGE REPORT ===\` describing what your script changed — including variable, mode and style edits; you must not attempt to summarize or diff the change yourself.

5. SNAPSHOT RECONCILIATION (KEEPS YOUR COPY OF THE FILE CURRENT):
   - \`=== FIGMA CHANGE REPORT ===\` and \`=== FIGMA NODE SNAPSHOT ===\` are the only sanctioned updates to your copy. Apply each one, in the order given, before answering further questions.
   - FIRST, CHECK THE PAYLOAD ARRIVED WHOLE. A payload is complete only if its \`=== END … ===\` footer is present AND its declared totals (\`counts\` on a report, \`node_count\` on a snapshot) match what you actually received. If the footer is missing or the totals do not agree, the message was CUT OFF: do NOT apply it, tell the user it was truncated, and ask them to copy a smaller selection or request a targeted re-export. Never apply a payload you cannot see the end of.
   - A change report is a CHANGELOG, NOT INSTRUCTIONS: \`created\` carries whole rows, \`updated\` carries merge patches (assign only the named fields onto the row you already hold), \`deleted\` carries subtree-root ids (remove each node and its descendants as you hold them). Tokens (\`tokens.created\` / \`tokens.updated\` / \`tokens.deleted\`) split the same way, and a deleted collection or variable cascades to its dependents.
   - A node snapshot is the user's current truth for the region they selected: add or replace the rows it lists. It cannot express deletions and never rewrites token definitions.
   - You own the mechanics. The report describes WHAT CHANGED; how you store it is yours to decide.
   - Only ask for a full re-export when a report is \`truncated\` (the plugin stopped early), when \`geometry_stale\` is set and you need exact geometry, or when a report and your copy disagree.
   - Never treat a report or snapshot as the source of truth for anything it does not mention.
`;
    const STANDARD_PROMPT_TEMPLATE = `=== FIGMA SYSTEM INITIALIZATION (STANDARD MODE) ===
You are an interactive Design System Consultant and Plugin API Execution Engine.

[COMPONENT INDEX]
{{MANIFEST}}

[VARIABLE COLLECTIONS]
{{VARIABLES}}
` + SYSTEM_RULES_HEADER;

    const EXPLORATIVE_PROMPT_TEMPLATE = `=== FIGMA SYSTEM INITIALIZATION (EXPLORATIVE LAZY MODE) ===
⚠️ LARGE FILE DETECTED: Global context pre-loading bypassed to protect memory.

[FILE MAP SKELETON]
- Pages Available: {{PAGES}}
- Variable Collections: {{COLLECTIONS}}
` + SYSTEM_RULES_HEADER + `
6. EXPLORATIVE DISCOVERY METHOD:
   You currently have no pre-loaded layer nodes. Prefer asking the user to select a target frame and click "Copy Selection Context". If global page searches are required, emit lightweight [READ-ONLY] query scripts ending with a \`return\` statement.`;

    const setupBtn = document.getElementById('setupBtn');
    const contextBtn = document.getElementById('contextBtn');
    const smartPasteField = document.getElementById('smartPasteField');
    const statusTag = document.getElementById('statusTag');
    const exportBtn = document.getElementById('exportBtn');
    const packStatus = document.getElementById('packStatus');
    const downloadDb = document.getElementById('downloadDb');
    const copyPrompt = document.getElementById('copyPrompt');

    let PRIMING_PAYLOAD_CACHE = '';
    let LIVE_SELECTION_MD = null;
    let exportSession = null;
    let exportFiles = null;
    let exportMetadata = {};
    let snapshotRequest = null;
    const PACK_DB_NAME = 'figma_superpowers.db';
    const SNAPSHOT_TIMEOUT_MS = 2500;

    function send(message) {
      parent.postMessage({ pluginMessage: message }, '*');
    }

    function copyTextToClipboard(text) {
      const area = document.createElement('textarea');
      area.value = text;
      area.style.cssText = 'position:fixed;left:-999999px';
      document.body.appendChild(area);
      area.focus();
      area.select();
      const ok = document.execCommand('copy');
      area.remove();
      return ok;
    }

    function finishError(error) {
      const message = error && error.message ? error.message : String(error);
      packStatus.textContent = 'Export failed: ' + message;
      exportBtn.textContent = 'Retry SQLite Export';
      exportBtn.className = 'export';
      exportBtn.disabled = false;
      send({ type: 'PACK_CANCEL' });
      if (exportSession) {
        try { exportSession.db.close(); } catch (ignored) { /* no-op */ }
      }
      exportSession = null;
      exportFiles = null;
      downloadDb.disabled = true;
      copyPrompt.disabled = true;
    }

    setupBtn.onclick = function () {
      if (!PRIMING_PAYLOAD_CACHE) {
        setupBtn.textContent = 'Evaluating file metrics...';
        setupBtn.disabled = true;
        send({ type: 'GENERATE_DYNAMIC_PRIMING_PROMPT' });
      } else {
        if (!copyTextToClipboard(PRIMING_PAYLOAD_CACHE)) {
          alert('Clipboard access failed. Please try again.');
          return;
        }
        alert('System prompt copied! Paste into AI webchat.');
        PRIMING_PAYLOAD_CACHE = '';
        setupBtn.className = 'setup';
        setupBtn.textContent = 'Evaluate & Scan File';
        statusTag.className = 'status-tag';
      }
    };

    function requestNodeSnapshot() {
      return new Promise(function (resolve, reject) {
        snapshotRequest = { resolve: resolve };
        send({ type: 'PACK_SNAPSHOT_REQUEST' });
        setTimeout(function () {
          if (snapshotRequest) {
            snapshotRequest = null;
            reject(new Error('Snapshot timed out'));
          }
        }, SNAPSHOT_TIMEOUT_MS);
      });
    }

    contextBtn.onclick = async function () {
      const context = LIVE_SELECTION_MD || 'No layer selected. Select a frame in Figma to pass local context.';
      let snapshot = null;
      try { snapshot = await requestNodeSnapshot(); } catch (error) { snapshot = null; }
      let payload = '=== FIGMA SELECTION CONTEXT ===\n' + context;
      if (snapshot && snapshot.nodes) {
        payload += '\n\n' + packWrapEnvelope(NODE_SNAPSHOT_HEADER, NODE_SNAPSHOT_FOOTER,
          JSON.stringify(snapshot));
      }
      if (!copyTextToClipboard(payload)) {
        alert('Clipboard access failed. Please try again.');
        return;
      }
      if (snapshot && snapshot.nodes) {
        const kb = Math.round(new Blob([payload]).size / 1024);
        alert('Selection context + node snapshot copied (' + snapshot.node_count +
          ' nodes, ~' + kb + ' KB). If the AI reports it was cut off, copy a smaller selection.');
      } else {
        alert('Selection context copied!');
      }
    };

    exportBtn.onclick = async function () {
      if (exportSession) {
        exportBtn.disabled = true;
        send({ type: 'PACK_CANCEL' });
        finishError(new Error('Cancelled by user'));
        return;
      }
      try {
        exportBtn.disabled = true;
        downloadDb.disabled = true;
        copyPrompt.disabled = true;
        exportFiles = null;
        exportMetadata = {};
        packStatus.textContent = 'Initializing local SQLite engine...';
        const SQL = await initSqlJs();
        exportSession = packOpenDatabase(SQL);
        packStatus.textContent = 'Scanning pages...';
        exportBtn.disabled = false;
        exportBtn.className = 'cancel';
        exportBtn.textContent = 'Cancel Export';
        send({ type: 'PACK_BEGIN' });
      } catch (error) { finishError(error); }
    };

    downloadDb.onclick = function () {
      if (exportFiles) packDownload(exportFiles.binary, PACK_DB_NAME, 'application/x-sqlite3');
    };
    copyPrompt.onclick = function () {
      if (!exportFiles) return;
      if (!copyTextToClipboard(exportFiles.prompt)) {
        alert('Clipboard access failed. Please try again.');
        return;
      }
      alert('Agent prompt copied! Paste it alongside the DB into your AI chat.');
    };

    smartPasteField.onpaste = function (event) {
      const pasted = (event.clipboardData || window.clipboardData).getData('text').trim();
      const match = pasted.match(/```javascript([\s\S]*?)```/);
      let code = '';
      if (match && match[1]) code = match[1].trim();
      else if (pasted.includes('figma') || pasted.startsWith('return')) {
        code = pasted.replace(/```javascript|```/g, '').trim();
      }
      if (code) {
        smartPasteField.value = 'Executing script...';
        send({ type: 'RUNUserCode', code: code });
        setTimeout(function () { smartPasteField.value = ''; smartPasteField.blur(); }, 800);
      }
    };

    window.onmessage = function (event) {
      const msg = event.data && event.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'PRIMING_DATA_READY') {
        if (msg.mode === 'EXPLORATIVE') {
          PRIMING_PAYLOAD_CACHE = EXPLORATIVE_PROMPT_TEMPLATE
            .replace('{{PAGES}}', msg.pageNames.join(', '))
            .replace('{{COLLECTIONS}}', msg.collectionsSummary.join(', '));
          statusTag.textContent = '🔍 Large File: Explorative Mode Active';
          statusTag.className = 'status-tag explorative';
        } else {
          PRIMING_PAYLOAD_CACHE = STANDARD_PROMPT_TEMPLATE
            .replace('{{MANIFEST}}', msg.manifestMd)
            .replace('{{VARIABLES}}', msg.variablesMd);
          statusTag.textContent = '⚡ Standard Mode Active';
          statusTag.className = 'status-tag standard';
        }
        setupBtn.disabled = false;
        setupBtn.className = 'setup ready';
        setupBtn.textContent = 'Copy System Prompt';
      }
      if (msg.type === 'SELECTION_UPDATED') {
        LIVE_SELECTION_MD = msg.nodeMarkdown;
        contextBtn.disabled = false;
        contextBtn.textContent = LIVE_SELECTION_MD ? 'Copy Selection Context' : 'Copy Canvas State';
      }
      if (msg.type === 'PACK_SNAPSHOT') {
        const pending = snapshotRequest;
        snapshotRequest = null;
        if (!pending) return;
        if (msg.error) pending.reject(new Error(msg.error));
        else pending.resolve(msg.snapshot);
      }
      if (msg.type === 'EXECUTION_RESULT') {
        if (msg.kind === 'CHANGE_REPORT') {
          const payload = packWrapEnvelope(CHANGE_REPORT_HEADER, CHANGE_REPORT_FOOTER, msg.data);
          copyTextToClipboard(payload);
          alert('Change report copied! Paste it back so the AI snapshot stays current.');
        } else {
          copyTextToClipboard('=== FIGMA TOOL RESPONSE ===\n' + msg.data);
          alert('Tool result copied! Paste back into your AI chat.');
        }
      }
      if (msg.type === 'PACK_META' && exportSession) exportMetadata = msg.metadata;
      if (msg.type === 'PACK_BATCH') {
        if (!exportSession) return;
        try {
          packInsertBatch(exportSession, msg.records);
          send({ type: 'PACK_ACK', sequence: msg.sequence });
        } catch (error) { finishError(error); }
      }
      if (msg.type === 'PACK_PROGRESS' && exportSession) {
        packStatus.textContent = msg.pages + '/' + msg.totalPages + ' pages scanned, ' +
          msg.nodes.toLocaleString() + ' nodes';
      }
      if (msg.type === 'PACK_DONE' && exportSession) {
        try {
          packStatus.textContent = 'Building search index and verifying SQLite...';
          if ((exportSession.counts.node || 0) !== msg.nodes) throw new Error('Node count mismatch');
          if ((exportSession.counts.page || 0) !== msg.pages) throw new Error('Page count mismatch');
          const files = packFinish(exportSession, exportMetadata, SYSTEM_RULES_HEADER);
          exportSession.db.close();
          exportSession = null;
          exportFiles = { binary: files.binary, prompt: files.prompt, fts: files.fts };
          exportBtn.className = 'export';
          exportBtn.textContent = 'Export Complete File to SQLite';
          exportBtn.disabled = false;
          downloadDb.disabled = false;
          copyPrompt.disabled = false;
          packStatus.textContent = 'Ready: ' + msg.nodes.toLocaleString() + ' nodes, ' +
            msg.pages + ' pages, ' + files.fts.toUpperCase() +
            ' search. Download the DB, then copy the prompt.';
        } catch (error) { finishError(error); }
      }
      if (msg.type === 'PACK_ERROR') finishError(new Error(msg.message));
    };
  </script>
</body>
</html>
