<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 12px;
      margin: 0;
      background: #fff;
      color: #333;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-sizing: border-box;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: #757575;
      text-transform: uppercase;
      display: block;
      margin-top: 4px;
    }

    button {
      width: 100%;
      background: #18a0fb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:disabled {
      background: #e6e6e6;
      color: #b3b3b3;
      cursor: not-allowed;
    }

    button.setup {
      background: #14ae5c;
    }

    button.setup.ready {
      background: #ffc700;
      color: #000;
      font-weight: bold;
      animation: pulse 1.5s infinite;
    }

    button.bake {
      background: #2c2c2c;
    }

    button.bake:hover {
      background: #1e1e1e;
    }

    .paste-zone {
      width: 100%;
      box-sizing: border-box;
      border: 2px dashed #f24822;
      color: #f24822;
      background: #fff5f2;
      border-radius: 6px;
      padding: 12px;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      resize: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .paste-zone:focus {
      outline: none;
      border-color: #dc3b16;
      background: #fff;
      color: #dc3b16;
      font-family: monospace;
      font-size: 10px;
      text-align: left;
      text-transform: none;
      font-weight: normal;
    }

    hr {
      border: 0;
      border-top: 1px solid #e6e6e6;
      margin: 4px 0;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.8;
      }

      100% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <label>Sync Environment</label>
  <button id="setupBtn" class="setup">Scan Project Library</button>

  <hr />

  <label>Work with AI</label>
  <button id="contextBtn" class="bake" disabled>Copy Selection Context</button>

  <hr />

  <label>Deploy or Query</label>
  <textarea id="smartPasteField" class="paste-zone" rows="1" placeholder="Click here & Paste (Cmd+V)"></textarea>

  <script>
    const SYSTEM_PROMPT_TEMPLATE = `=== FIGMA SYSTEM INITIALIZATION ===
You are acting as an interactive Design System Consultant and Figma Plugin Tooling Compiler.
Below is the Master Component Index and Variable Library for this project.

[MASTER COMPONENT INDEX]
{{MANIFEST}}

[DESIGN TOKEN & VARIABLE COLLECTIONS]
{{VARIABLES}}

==================================================
OPERATIONAL RULES:
==================================================
1. TWO-WAY TOOLING EXECUTION: You can inspect the canvas dynamically. If you need more detail on a specific component, node structure, or variable value, output an inspection query script inside a \`\`\`javascript code block ending with a \`return\` statement. The user will paste it into the plugin, and the answer will be copied to their clipboard to paste back to you.

   Example Context Query:
   \`\`\`javascript
   const sel = figma.currentPage.selection[0];
   return { name: sel.name, fills: sel.fills, childrenCount: sel.children.length };
   \`\`\`

2. DESIGN SYSTEM CONSULTATION: When asked for advice, critique, or recommendations, respond directly in clear Markdown. Propose matching tokens or components from the catalog.

3. CANVAS MODIFICATION & EXECUTION: When explicitly asked to generate layout updates or create nodes, output a single, executable \`\`\`javascript block.

CRITICAL FIGMA API CODE RULES:
- Access target nodes via: const targetNode = figma.currentPage.selection[0];
- Binding paint tokens (Fills/Strokes) MUST use array cloning and setBoundVariableForPaint:
  function deepCopy(val) { return JSON.parse(JSON.stringify(val)); }
  const fillsCopy = deepCopy(targetNode.fills);
  fillsCopy[0] = figma.variables.setBoundVariableForPaint(fillsCopy[0], 'color', colorToken);
  targetNode.fills = fillsCopy;
- ES6 COMPATIBILITY ONLY: NEVER use optional chaining (?.) or nullish coalescing (??).
`;

    const CONTEXT_CAPSULE_TEMPLATE = `=== FIGMA CONTEXT CAPSULE ===
[TARGET LAYOUT STRUCTURE]
{{TARGET_DATA}}

[CANVAS STATE]
Current Page: "{{PAGE_NAME}}"
Scope: {{TARGETING_STATE}}
=============================`;

    const setupBtn = document.getElementById('setupBtn');
    const contextBtn = document.getElementById('contextBtn');
    const smartPasteField = document.getElementById('smartPasteField');

    let PRIMING_PAYLOAD_CACHE = "";
    let LIVE_SELECTION_MD = null;
    let IS_GLOBAL_MODE = true;
    let ACTIVE_PAGE_NAME = "";

    function copyTextToClipboard(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      return new Promise((resolve) => {
        document.execCommand('copy');
        textArea.remove();
        resolve();
      });
    }

    setupBtn.onclick = async () => {
      if (!PRIMING_PAYLOAD_CACHE) {
        setupBtn.innerText = "Scanning project environment...";
        setupBtn.disabled = true;
        parent.postMessage({ pluginMessage: { type: 'GENERATE_DYNAMIC_PRIMING_PROMPT' } }, '*');
      } else {
        try {
          await copyTextToClipboard(PRIMING_PAYLOAD_CACHE);
          alert("🟢 System context copied! Paste it into your AI chat.");
          PRIMING_PAYLOAD_CACHE = "";
          setupBtn.className = "setup";
          setupBtn.innerText = "Scan Project Library";
        } catch (err) {
          alert("Error: " + err.message);
        }
      }
    };

    contextBtn.onclick = async () => {
      const targetDataString = IS_GLOBAL_MODE
        ? "No layer selected. Operating globally on page scope."
        : LIVE_SELECTION_MD;

      const finalPayload = CONTEXT_CAPSULE_TEMPLATE
        .replace("{{TARGET_DATA}}", targetDataString)
        .replace("{{PAGE_NAME}}", ACTIVE_PAGE_NAME)
        .replace("{{TARGETING_STATE}}", IS_GLOBAL_MODE ? "GLOBAL PAGE SCOPE" : "LOCAL SELECTION BOUNDS");

      try {
        await copyTextToClipboard(finalPayload);
        alert(IS_GLOBAL_MODE ? "🌐 Global Page context copied!" : "🚀 Selection context copied!");
      } catch (err) {
        alert("Copy error: " + err.message);
      }
    };

    smartPasteField.onpaste = async (e) => {
      const pastedText = (e.clipboardData || window.clipboardData).getData('text').trim();

      let extractedCode = "";
      const codeBlockRegex = /```javascript([\s\S]*?)```/;
      const match = pastedText.match(codeBlockRegex);

      if (match && match[1]) {
        extractedCode = match[1].trim();
      } else if (pastedText.includes("figma") || pastedText.startsWith("return") || pastedText.startsWith("(async")) {
        extractedCode = pastedText.replace(/```javascript|```/g, "").trim();
      }

      if (extractedCode) {
        smartPasteField.value = "Processing script...";
        smartPasteField.style.borderColor = "#14ae5c";

        parent.postMessage({ pluginMessage: { type: 'RUNUserCode', code: extractedCode } }, '*');

        setTimeout(() => {
          smartPasteField.value = "";
          smartPasteField.blur();
        }, 800);
      } else {
        alert("⚠️ No valid JavaScript code block detected in clipboard.");
        setTimeout(() => { smartPasteField.value = ""; }, 10);
      }
    };

    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;

      if (msg.type === 'PRIMING_DATA_READY') {
        PRIMING_PAYLOAD_CACHE = SYSTEM_PROMPT_TEMPLATE
          .replace("{{MANIFEST}}", msg.manifestMd)
          .replace("{{VARIABLES}}", msg.variablesMd);

        setupBtn.disabled = false;
        setupBtn.className = "setup ready";
        setupBtn.innerText = "Copy System Prompt (Ready)";
      }

      if (msg.type === 'SELECTION_UPDATED') {
        LIVE_SELECTION_MD = msg.nodeMarkdown;
        ACTIVE_PAGE_NAME = msg.pageName || "Active Workspace";
        contextBtn.disabled = false;

        if (LIVE_SELECTION_MD) {
          IS_GLOBAL_MODE = false;
          contextBtn.innerText = "Copy Selection Context";
        } else {
          IS_GLOBAL_MODE = true;
          contextBtn.innerText = "Copy Page Scope Context";
        }
      }

      if (msg.type === 'EXECUTION_RESULT') {
        const payload = "=== FIGMA TOOL RESPONSE ===\n" + msg.data;
        await copyTextToClipboard(payload);
        alert("📋 Query result copied to clipboard! Paste it directly back to your AI chat.");
      }
    };
  </script>
</body>

</html>
