<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 12px;
      margin: 0;
      background: #fff;
      color: #333;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-sizing: border-box;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: #757575;
      text-transform: uppercase;
      display: block;
      margin-top: 4px;
    }

    button {
      width: 100%;
      background: #18a0fb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:disabled {
      background: #e6e6e6;
      color: #b3b3b3;
      cursor: not-allowed;
    }

    button.setup {
      background: #14ae5c;
    }

    button.setup.ready {
      background: #ffc700;
      color: #000;
      font-weight: bold;
      animation: pulse 1.5s infinite;
    }

    button.bake {
      background: #2c2c2c;
    }

    button.bake:hover {
      background: #1e1e1e;
    }

    .status-tag {
      font-size: 10px;
      font-weight: bold;
      padding: 4px 6px;
      border-radius: 4px;
      text-align: center;
      display: none;
    }

    .status-tag.explorative {
      background: #fff3cd;
      color: #856404;
      display: block;
    }

    .status-tag.standard {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .paste-zone {
      width: 100%;
      box-sizing: border-box;
      border: 2px dashed #f24822;
      color: #f24822;
      background: #fff5f2;
      border-radius: 6px;
      padding: 12px;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      resize: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .paste-zone:focus {
      outline: none;
      border-color: #dc3b16;
      background: #fff;
      color: #dc3b16;
      font-family: monospace;
      font-size: 10px;
      text-align: left;
      text-transform: none;
    }

    hr {
      border: 0;
      border-top: 1px solid #e6e6e6;
      margin: 4px 0;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.8;
      }

      100% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <label>Environment Sync</label>
  <button id="setupBtn" class="setup">Evaluate & Scan File</button>
  <div id="statusTag" class="status-tag"></div>

  <hr />

  <label>Work with AI</label>
  <button id="contextBtn" class="bake" disabled>Copy Selection Context</button>

  <hr />

  <label>Tooling Clipboard Bridge</label>
  <textarea id="smartPasteField" class="paste-zone" rows="1" placeholder="Click here & Paste (Cmd+V)"></textarea>

  <script>
    const SYSTEM_RULES_HEADER = `
==================================================
STRICT CODE GENERATION & EXECUTION RULES:
==================================================
1. SELECTION CONTEXT FEATURE PREFERENCE:
   - The user has a native "Copy Selection Context" button in their Figma plugin interface.
   - If you need to inspect, review, or analyze the layout, styles, or layer tree of an element the user is currently looking at or working on, DO NOT generate a [READ-ONLY] JavaScript code snippet to read figma.currentPage.selection.
   - Instead, ask the user to select the element and click "Copy Selection Context" in the plugin, then paste the context capsule into this chat.
   - Only generate [READ-ONLY] JavaScript queries when you need to search across unselected pages, find components globally by name, or extract variable details that cannot be covered by a direct canvas selection.

2. ACTION TYPE & EXPECTED OUTCOME FLAG:
   Immediately before ANY \`\`\`javascript code block, you MUST state the action type and expected outcome:
   - **Action Type**: [READ-ONLY] or [WRITE/MUTATION]
   - **Expected Outcome**: [e.g., "Copy layer hierarchy to clipboard" | "Component adjusted" | "New component created"]

3. ZERO PLACEHOLDERS / "AS IS" EXECUTION GUARANTEE:
   - All code inside \`\`\`javascript MUST execute immediately "as is" when pasted.
   - NEVER output code with generic placeholders (e.g., "YOUR_NODE_ID_HERE", "<component-name>", "/* insert token here */").
   - If missing target IDs or parameters, write a dynamic query first (e.g., figma.currentPage.findOne(...)), operate on figma.currentPage.selection[0], or ask the user to select the frame and click "Copy Selection Context" BEFORE generating code.

4. READ-ONLY RETURN CONTRACT (CLIPBOARD LOOP):
   - Every [READ-ONLY] \`\`\`javascript block MUST end with a \`return\` statement that produces the requested data (object, array, or string).
   - NEVER use console.log() or any console.* call: console output is invisible in Figma and is NEVER copied to the clipboard. A READ snippet that only logs is broken.
   - Only a returned value is auto-copied by the plugin as \`=== FIGMA TOOL RESPONSE ===\` for the user to paste back into this chat. A [READ-ONLY] block without \`return\` yields no feedback.
   - Conversely, [WRITE/MUTATION] blocks MUST NOT return a value.
`;

    const STANDARD_PROMPT_TEMPLATE = `=== FIGMA SYSTEM INITIALIZATION (STANDARD MODE) ===
You are an interactive Design System Consultant and Plugin API Execution Engine.

[COMPONENT INDEX]
{{MANIFEST}}

[VARIABLE COLLECTIONS]
{{VARIABLES}}
` + SYSTEM_RULES_HEADER;

    const EXPLORATIVE_PROMPT_TEMPLATE = `=== FIGMA SYSTEM INITIALIZATION (EXPLORATIVE LAZY MODE) ===
⚠️ LARGE FILE DETECTED: Global context pre-loading bypassed to protect memory.

[FILE MAP SKELETON]
- Pages Available: {{PAGES}}
- Variable Collections: {{COLLECTIONS}}
` + SYSTEM_RULES_HEADER + `
5. EXPLORATIVE DISCOVERY METHOD:
   You currently have no pre-loaded layer nodes. Prefer asking the user to select a target frame and click "Copy Selection Context". If global page searches are required, emit lightweight [READ-ONLY] query scripts ending with a \`return\` statement.`;

    const setupBtn = document.getElementById('setupBtn');
    const contextBtn = document.getElementById('contextBtn');
    const smartPasteField = document.getElementById('smartPasteField');
    const statusTag = document.getElementById('statusTag');

    let PRIMING_PAYLOAD_CACHE = "";
    let LIVE_SELECTION_MD = null;

    function copyTextToClipboard(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      return new Promise((resolve) => {
        document.execCommand('copy');
        textArea.remove();
        resolve();
      });
    }

    setupBtn.onclick = async () => {
      if (!PRIMING_PAYLOAD_CACHE) {
        setupBtn.innerText = "Evaluating file metrics...";
        setupBtn.disabled = true;
        parent.postMessage({ pluginMessage: { type: 'GENERATE_DYNAMIC_PRIMING_PROMPT' } }, '*');
      } else {
        await copyTextToClipboard(PRIMING_PAYLOAD_CACHE);
        alert("🟢 System prompt copied! Paste into AI webchat.");
        PRIMING_PAYLOAD_CACHE = "";
        setupBtn.className = "setup";
        setupBtn.innerText = "Evaluate & Scan File";
        statusTag.className = "status-tag";
      }
    };

    contextBtn.onclick = async () => {
      const textToCopy = LIVE_SELECTION_MD || "No layer selected. Select a frame in Figma to pass local context.";
      await copyTextToClipboard("=== FIGMA SELECTION CONTEXT ===\n" + textToCopy);
      alert("🚀 Selection context copied!");
    };

    smartPasteField.onpaste = async (e) => {
      const pastedText = (e.clipboardData || window.clipboardData).getData('text').trim();

      let extractedCode = "";
      const match = pastedText.match(/```javascript([\s\S]*?)```/);

      if (match && match[1]) {
        extractedCode = match[1].trim();
      } else if (pastedText.includes("figma") || pastedText.startsWith("return")) {
        extractedCode = pastedText.replace(/```javascript|```/g, "").trim();
      }

      if (extractedCode) {
        smartPasteField.value = "Executing script...";
        parent.postMessage({ pluginMessage: { type: 'RUNUserCode', code: extractedCode } }, '*');
        setTimeout(() => { smartPasteField.value = ""; smartPasteField.blur(); }, 800);
      }
    };

    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;

      if (msg.type === 'PRIMING_DATA_READY') {
        if (msg.mode === "EXPLORATIVE") {
          PRIMING_PAYLOAD_CACHE = EXPLORATIVE_PROMPT_TEMPLATE
            .replace("{{PAGES}}", msg.pageNames.join(", "))
            .replace("{{COLLECTIONS}}", msg.collectionsSummary.join(", "));
          statusTag.innerText = "🔍 Large File: Explorative Mode Active";
          statusTag.className = "status-tag explorative";
        } else {
          PRIMING_PAYLOAD_CACHE = STANDARD_PROMPT_TEMPLATE
            .replace("{{MANIFEST}}", msg.manifestMd)
            .replace("{{VARIABLES}}", msg.variablesMd);
          statusTag.innerText = "⚡ Standard Mode Active";
          statusTag.className = "status-tag standard";
        }

        setupBtn.disabled = false;
        setupBtn.className = "setup ready";
        setupBtn.innerText = "Copy System Prompt";
      }

      if (msg.type === 'SELECTION_UPDATED') {
        LIVE_SELECTION_MD = msg.nodeMarkdown;
        contextBtn.disabled = false;
        contextBtn.innerText = LIVE_SELECTION_MD ? "Copy Selection Context" : "Copy Canvas State";
      }

      if (msg.type === 'EXECUTION_RESULT') {
        await copyTextToClipboard("=== FIGMA TOOL RESPONSE ===\n" + msg.data);
        alert("📋 Tool result copied! Paste back into your AI chat.");
      }
    };
  </script>
</body>

</html>
