<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 12px;
      margin: 0;
      background: #fff;
      color: #333;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-sizing: border-box;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: #757575;
      text-transform: uppercase;
      display: block;
      margin-top: 4px;
    }

    button {
      width: 100%;
      background: #18a0fb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:disabled {
      background: #e6e6e6;
      color: #b3b3b3;
      cursor: not-allowed;
    }

    button.setup {
      background: #14ae5c;
    }

    button.setup:hover {
      background: #0f964e;
    }

    button.setup.ready {
      background: #ffc700;
      color: #000;
      font-weight: bold;
      animation: pulse 1.5s infinite;
    }

    button.bake {
      background: #2c2c2c;
    }

    button.bake:hover {
      background: #1e1e1e;
    }

    /* Smart Paste Field Styling */
    .paste-zone {
      width: 100%;
      box-sizing: border-box;
      border: 2px dashed #f24822;
      color: #f24822;
      background: #fff5f2;
      border-radius: 6px;
      padding: 12px;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      resize: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .paste-zone:focus {
      outline: none;
      border-color: #dc3b16;
      background: #fff;
      color: #dc3b16;
      font-family: monospace;
      font-size: 10px;
      text-align: left;
      text-transform: none;
      font-weight: normal;
    }

    hr {
      border: 0;
      border-top: 1px solid #e6e6e6;
      margin: 4px 0;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.8;
      }

      100% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <label>Sync Environment</label>
  <button id="setupBtn" class="setup">Scan Project Library</button>

  <hr />

  <label>Work with AI</label>
  <button id="contextBtn" class="bake" disabled>Copy Design Context</button>

  <hr />

  <label>Deploy Changes</label>
  <textarea id="smartPasteField" class="paste-zone" rows="1" placeholder="Click here & Paste (Cmd+V)"></textarea>

  <script>
    const SYSTEM_PROMPT_TEMPLATE = `=== FIGMA SYSTEM INITIALIZATION ===
You are acting as an interactive Design System Expert and Figma Plugin API Code Compiler.
Below is our Master Component Catalog, the complete Design Token / Variable Library, and the Variable Collection structure for this project file.

[MASTER COMPONENT CATALOG]
{{MANIFEST}}

[GLOBAL DESIGN TOKENS & VARIABLES]
{{VARIABLES}}

[VARIABLE COLLECTIONS]
{{COLLECTIONS}}

==================================================
CRITICAL OPERATIONAL RULES FOR THIS SESSION:
==================================================
1. Memorize the names and unique 'key' fields for all components and design variables.
2. Memorize the Variable Collections, their modes, and which tokens belong to which collection.
3. When creating new tokens, prefer an existing semantically matching collection instead of creating a new collection.
4. The user will write an instruction in natural language and append a "=== FIGMA CONTEXT CAPSULE ===" data snapshot.
5. Treat their conversational text request as the target instruction, using the context capsule structural boundaries to identify layer parameters.

DETERMINE THE DESIGNER'S INTENT AND RESPOND USING ONE OF THESE TWO MODES:

MODE A: CONSULTATION & DIALOGUE MODE (If user asks a question or request is ambiguous)
- Start your response immediately with the header "### 💬 Design System Consultation:"
- Propose matching tokens or components directly from your catalog memory. Do not write code blocks.

MODE B: EXECUTION MODE (If user gives a clear directive to modify layouts)
- PHASE 1: Validation Analysis (Start with header "### 🔍 Validation Analysis:")
  Review structural intent against properties. Identify missing properties or layout conflict risks.
- PHASE 2: Execution Code (Output a strict, single markdown code block starting with \`\`\`javascript and ending with \`\`\`)

STRICT CODE BLOCK COMPILATION FORMAT RULES:
1. Wrap all executable source code inside a single standard markdown code block starting with \`\`\`javascript and ending with \`\`\`. No other usages of \`\`\` are allowed in your output.
2. Do NOT write sentences or intros immediately before the code block box.
3. Access active nodes via: const mainFrame = figma.currentPage.selection[0];
4. If context capsule data block is null, find layers globally via: figma.currentPage.findOne(n => n.name === "Name");
5. Bundle code inside an asynchronous IIFE scope container layer: (async () => { ... })();

6. CRITICAL FIGMA VARIABLE BINDING RULES FOR CODE GENERATION:
   - For dimensions, sizes, opacity, or gaps, you CAN use flat mapping:
     node.setBoundVariable('itemSpacing', variablePointer);
   - For color 'fills' or 'strokes', you CANNOT use node.setBoundVariable(). You MUST create a deep copy of the array and use figma.variables.setBoundVariableForPaint() on an individual paint slot.

   Use this implementation pattern when modifying a color token fill:
     function deepCopy(value) {
       return JSON.parse(JSON.stringify(value));
     }

     const fillsCopy = deepCopy(targetNode.fills);
     fillsCopy[0] = figma.variables.setBoundVariableForPaint(fillsCopy[0], 'color', colorToken);
     targetNode.fills = fillsCopy;

7. CRITICAL JAVASCRIPT COMPATIBILITY RULE:
   - DO NOT USE modern ES2020 syntax such as Optional Chaining (?.) or Nullish Coalescing (??) inside your generated code blocks. The Figma plugin runtime compiler environment will throw a syntax error.
   - For safety checks, ALWAYS use traditional ES6 syntax:
     Instead of "figma.currentUser?.name ?? 'Anonymous'", write:
     "(figma.currentUser && figma.currentUser.name) ? figma.currentUser.name : 'Anonymous'"
`;

    const CONTEXT_CAPSULE_TEMPLATE = `=== FIGMA CONTEXT CAPSULE ===
[TARGET PARENT FRAME DATA]
{{TARGET_DATA}}

[ACTIVE CANVAS ENVIRONMENT]
Current Page: "{{PAGE_NAME}}"
Targeting State: {{TARGETING_STATE}}
=============================
Pair this data package with your layout adjustment instruction.`;

    const setupBtn = document.getElementById('setupBtn');
    const contextBtn = document.getElementById('contextBtn');
    const smartPasteField = document.getElementById('smartPasteField');

    let PRIMING_PAYLOAD_CACHE = "";
    let LIVE_SELECTION_DATA = null;
    let IS_GLOBAL_MODE = true;
    let ACTIVE_PAGE_NAME = "";

    function copyTextToClipboard(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      return new Promise((resolve) => {
        document.execCommand('copy');
        textArea.remove();
        resolve();
      });
    }

    setupBtn.onclick = async () => {
      if (!PRIMING_PAYLOAD_CACHE) {
        setupBtn.innerText = "Scanning project environment...";
        setupBtn.disabled = true;
        parent.postMessage({ pluginMessage: { type: 'GENERATE_DYNAMIC_PRIMING_PROMPT' } }, '*');
      } else {
        try {
          await copyTextToClipboard(PRIMING_PAYLOAD_CACHE);
          alert("🟢 System context copied! Paste it into a new AI chat tab.");
          PRIMING_PAYLOAD_CACHE = "";
          setupBtn.className = "setup";
          setupBtn.innerText = "1. Scan Project Library";
        } catch (err) {
          alert("Error: " + err.message);
        }
      }
    };

    contextBtn.onclick = async () => {
      const targetDataString = IS_GLOBAL_MODE
        ? "null \n/* Note: No specific layout selection active. Perform operations globally using tree search lookups. */"
        : JSON.stringify(LIVE_SELECTION_DATA, null, 2);

      const finalPayload = CONTEXT_CAPSULE_TEMPLATE
        .replace("{{TARGET_DATA}}", targetDataString)
        .replace("{{PAGE_NAME}}", ACTIVE_PAGE_NAME)
        .replace("{{TARGETING_STATE}}", IS_GLOBAL_MODE ? "GLOBAL PAGE SCOPE" : "LOCAL SELECTION BOUNDS");

      try {
        await copyTextToClipboard(finalPayload);
        alert(IS_GLOBAL_MODE ? "🌐 Global Page context copied!" : "🚀 Selection context copied!");
      } catch (err) {
        alert("Copy error: " + err.message);
      }
    };

    smartPasteField.onpaste = async (e) => {
      const pastedText = (e.clipboardData || window.clipboardData).getData('text').trim();

      let extractedCode = "";
      const codeBlockRegex = /```javascript([\s\S]*?)```/;
      const match = pastedText.match(codeBlockRegex);

      if (match && match[1]) {
        extractedCode = match[1].trim();
      } else if (pastedText.includes("figma") || pastedText.startsWith("(async")) {
        extractedCode = pastedText.replace(/```javascript|```/g, "").trim();
      }

      if (extractedCode) {
        smartPasteField.value = "Executing script...";
        smartPasteField.style.borderColor = "#14ae5c";

        parent.postMessage({ pluginMessage: { type: 'RUNUserCode', code: extractedCode } }, '*');

        setTimeout(() => {
          smartPasteField.value = "";
          smartPasteField.blur();
        }, 800);
      } else {
        alert("⚠️ No valid Figma execution code detected in your clipboard.");
        setTimeout(() => {
          smartPasteField.value = "";
        }, 10);
      }
    };

    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;

      if (msg.type === 'PRIMING_DATA_READY') {
        PRIMING_PAYLOAD_CACHE = SYSTEM_PROMPT_TEMPLATE
          .replace("{{MANIFEST}}", JSON.stringify(msg.manifest, null, 2))
          .replace("{{VARIABLES}}", JSON.stringify(msg.variables, null, 2))
          .replace("{{COLLECTIONS}}", JSON.stringify(msg.collections, null, 2));

        setupBtn.disabled = false;
        setupBtn.className = "setup ready";
        setupBtn.innerText = "Copy Setup Prompt (Ready)";
      }

      if (msg.type === 'SELECTION_UPDATED') {
        LIVE_SELECTION_DATA = msg.nodeData;
        ACTIVE_PAGE_NAME = msg.pageName || "Active Workspace";
        contextBtn.disabled = false;

        if (LIVE_SELECTION_DATA) {
          IS_GLOBAL_MODE = false;
          contextBtn.innerText = "Copy Selection Context";
        } else {
          IS_GLOBAL_MODE = true;
          contextBtn.innerText = "Copy Page Scope Context";
        }
      }
    };
  </script>
</body>

</html>
