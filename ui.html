<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 12px;
      margin: 0;
      background: #fff;
      color: #333;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-sizing: border-box;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: #757575;
      text-transform: uppercase;
      display: block;
      margin-top: 4px;
    }

    button {
      width: 100%;
      background: #18a0fb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:disabled {
      background: #e6e6e6;
      color: #b3b3b3;
      cursor: not-allowed;
    }

    button.setup {
      background: #14ae5c;
    }

    button.setup.ready {
      background: #ffc700;
      color: #000;
      font-weight: bold;
      animation: pulse 1.5s infinite;
    }

    button.bake {
      background: #2c2c2c;
    }

    button.bake:hover {
      background: #1e1e1e;
    }

    .status-tag {
      font-size: 10px;
      font-weight: bold;
      padding: 4px 6px;
      border-radius: 4px;
      text-align: center;
      display: none;
    }

    .status-tag.explorative {
      background: #fff3cd;
      color: #856404;
      display: block;
    }

    .status-tag.standard {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .paste-zone {
      width: 100%;
      box-sizing: border-box;
      border: 2px dashed #f24822;
      color: #f24822;
      background: #fff5f2;
      border-radius: 6px;
      padding: 12px;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      resize: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .paste-zone:focus {
      outline: none;
      border-color: #dc3b16;
      background: #fff;
      color: #dc3b16;
      font-family: monospace;
      font-size: 10px;
      text-align: left;
      text-transform: none;
    }

    hr {
      border: 0;
      border-top: 1px solid #e6e6e6;
      margin: 4px 0;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.8;
      }

      100% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <label>Environment Sync</label>
  <button id="setupBtn" class="setup">Evaluate & Scan File</button>
  <div id="statusTag" class="status-tag"></div>

  <hr />

  <label>Work with AI</label>
  <button id="contextBtn" class="bake" disabled>Copy Selection Context</button>

  <hr />

  <label>Tooling Clipboard Bridge</label>
  <textarea id="smartPasteField" class="paste-zone" rows="1" placeholder="Click here & Paste (Cmd+V)"></textarea>

  <script>
    const STANDARD_PROMPT_TEMPLATE = `=== FIGMA SYSTEM INITIALIZATION (STANDARD MODE) ===
You are an interactive Design System Consultant and Plugin API Execution Engine.

[COMPONENT INDEX]
{{MANIFEST}}

[VARIABLE COLLECTIONS]
{{VARIABLES}}

Execute operations by returning single \`\`\`javascript blocks or query canvas details dynamically using \`return\` statements.`;

    const EXPLORATIVE_PROMPT_TEMPLATE = `=== FIGMA SYSTEM INITIALIZATION (EXPLORATIVE LAZY MODE) ===
⚠️ LARGE FILE DETECTED: Global context pre-loading was bypassed to preserve memory.
You are connected via an interactive two-way tooling interface.

[FILE MAP SKELETON]
- Pages Available: {{PAGES}}
- Variable Collections: {{COLLECTIONS}}

==================================================
EXPLORATIVE OPERATIONAL RULES:
==================================================
1. You currently have NO canvas node pre-loaded.
2. To inspect components, layers, or variables, write a lightweight inspection script ending with a \`return\` statement inside a \`\`\`javascript block.
3. The user will execute it in the plugin and paste the output back to you.

EXEMPLAR DISCOVERY QUERIES:
- Find components on page:
  \`\`\`javascript
  return figma.currentPage.findAllWithCriteria({ types: ["COMPONENT"] }).map(c => c.name);
  \`\`\`
- Get details on selected element:
  \`\`\`javascript
  const sel = figma.currentPage.selection[0];
  return { name: sel.name, type: sel.type, fills: sel.fills };
  \`\`\`
- Read variable collection tokens:
  \`\`\`javascript
  const cols = await figma.variables.getLocalVariableCollectionsAsync();
  const vars = await figma.variables.getLocalVariablesAsync();
  return { collections: cols.map(c => c.name), totalVars: vars.length };
  \`\`\``;

    const setupBtn = document.getElementById('setupBtn');
    const contextBtn = document.getElementById('contextBtn');
    const smartPasteField = document.getElementById('smartPasteField');
    const statusTag = document.getElementById('statusTag');

    let PRIMING_PAYLOAD_CACHE = "";
    let LIVE_SELECTION_MD = null;

    function copyTextToClipboard(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      return new Promise((resolve) => {
        document.execCommand('copy');
        textArea.remove();
        resolve();
      });
    }

    setupBtn.onclick = async () => {
      if (!PRIMING_PAYLOAD_CACHE) {
        setupBtn.innerText = "Evaluating file metrics...";
        setupBtn.disabled = true;
        parent.postMessage({ pluginMessage: { type: 'GENERATE_DYNAMIC_PRIMING_PROMPT' } }, '*');
      } else {
        await copyTextToClipboard(PRIMING_PAYLOAD_CACHE);
        alert("🟢 Prompt copied! Paste into AI webchat.");
        PRIMING_PAYLOAD_CACHE = "";
        setupBtn.className = "setup";
        setupBtn.innerText = "Evaluate & Scan File";
        statusTag.className = "status-tag";
      }
    };

    contextBtn.onclick = async () => {
      const textToCopy = LIVE_SELECTION_MD || "No element selected. Select a frame in Figma to pass local context.";
      await copyTextToClipboard("=== FIGMA SELECTION CONTEXT ===\n" + textToCopy);
      alert("🚀 Selection context copied!");
    };

    smartPasteField.onpaste = async (e) => {
      const pastedText = (e.clipboardData || window.clipboardData).getData('text').trim();

      let extractedCode = "";
      const match = pastedText.match(/```javascript([\s\S]*?)```/);

      if (match && match[1]) {
        extractedCode = match[1].trim();
      } else if (pastedText.includes("figma") || pastedText.startsWith("return")) {
        extractedCode = pastedText.replace(/```javascript|```/g, "").trim();
      }

      if (extractedCode) {
        smartPasteField.value = "Running script...";
        parent.postMessage({ pluginMessage: { type: 'RUNUserCode', code: extractedCode } }, '*');
        setTimeout(() => { smartPasteField.value = ""; smartPasteField.blur(); }, 800);
      }
    };

    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;

      if (msg.type === 'PRIMING_DATA_READY') {
        if (msg.mode === "EXPLORATIVE") {
          PRIMING_PAYLOAD_CACHE = EXPLORATIVE_PROMPT_TEMPLATE
            .replace("{{PAGES}}", msg.pageNames.join(", "))
            .replace("{{COLLECTIONS}}", msg.collectionsSummary.join(", "));
          statusTag.innerText = "🔍 Large File: Explorative Mode Active";
          statusTag.className = "status-tag explorative";
        } else {
          PRIMING_PAYLOAD_CACHE = STANDARD_PROMPT_TEMPLATE
            .replace("{{MANIFEST}}", msg.manifestMd)
            .replace("{{VARIABLES}}", msg.variablesMd);
          statusTag.innerText = "⚡ Standard Mode Active";
          statusTag.className = "status-tag standard";
        }

        setupBtn.disabled = false;
        setupBtn.className = "setup ready";
        setupBtn.innerText = "Copy Prompt for AI";
      }

      if (msg.type === 'SELECTION_UPDATED') {
        LIVE_SELECTION_MD = msg.nodeMarkdown;
        contextBtn.disabled = false;
        contextBtn.innerText = LIVE_SELECTION_MD ? "Copy Selection Context" : "Copy Canvas State";
      }

      if (msg.type === 'EXECUTION_RESULT') {
        await copyTextToClipboard("=== FIGMA TOOL RESPONSE ===\n" + msg.data);
        alert("📋 Tool result copied! Paste back into your AI chat.");
      }
    };
  </script>
</body>

</html>
